<style>
  /* ============ couleurs : clair par défaut, sombre selon le système ou le bouton ============ */
  :root{
    --bg:#f5f4f0; --surface:#ffffff; --sunk:#efede8;
    --ink:#171612; --muted:#66635b; --faint:#9c988e; --line:#e2dfd7; --line-strong:#cfcbc1;
    --accent:#a8691a; --accent-ink:#ffffff; --accent-soft:rgba(168,105,26,.09);
    --danger:#c2412d;
    --sans:"Geist",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ease:cubic-bezier(.2,.8,.2,1);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#121211; --surface:#191917; --sunk:#0e0e0d;
      --ink:#ecebe5; --muted:#a09d94; --faint:#6c6a63; --line:#292825; --line-strong:#3a3935;
      --accent:#e3b46a; --accent-ink:#1b1407; --accent-soft:rgba(227,180,106,.10);
      --danger:#ec6f59; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121211; --surface:#191917; --sunk:#0e0e0d;
    --ink:#ecebe5; --muted:#a09d94; --faint:#6c6a63; --line:#292825; --line-strong:#3a3935;
    --accent:#e3b46a; --accent-ink:#1b1407; --accent-soft:rgba(227,180,106,.10);
    --danger:#ec6f59; color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  ::selection{background:var(--accent);color:var(--accent-ink)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}

  /* ============ barre du haut ============ */
  .top{display:flex;align-items:center;gap:20px;padding:14px 28px;
    border-bottom:1px solid var(--line);background:var(--bg);
    position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
  .brand svg{flex:none;color:var(--accent)}
  .brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .brand span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;
    border:1px solid var(--line);background:var(--surface);border-radius:8px;
    font-size:13.5px;color:var(--ink);white-space:nowrap;
    transition:border-color .15s,background .15s,transform .1s}
  .tbtn:hover{border-color:var(--line-strong)}
  .tbtn:active{transform:scale(.97)}
  .tbtn svg{flex:none}
  .tbtn.icon{width:34px;padding:0;justify-content:center}
  .tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

  /* chrono */
  .chrono{display:flex;align-items:center;gap:6px}
  .clock{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;min-width:4.6ch;text-align:right;color:var(--muted);
    transition:color .2s}
  .clock.running{color:var(--ink)}
  .clock.over{color:var(--danger)}
  .chrono select{height:34px;border:1px solid var(--line);background:var(--surface);
    border-radius:8px;padding:0 8px;font-size:13.5px;cursor:pointer}
  .sep{width:1px;height:22px;background:var(--line)}

  /* ============ page ============ */
  .app{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
  .settings{border-right:1px solid var(--line);padding:24px 24px 28px;display:flex;
    flex-direction:column;gap:22px;position:sticky;top:var(--top-h,63px);
    height:calc(100vh - var(--top-h,63px));height:calc(100dvh - var(--top-h,63px));overflow:auto}
  .field>.lab{display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;color:var(--muted);margin-bottom:8px}
  .field>.lab small{font-size:12px;color:var(--faint)}

  /* boutons segmentés */
  .seg{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:2px;padding:2px;
    background:var(--sunk);border:1px solid var(--line);border-radius:9px}
  .seg button{border:0;background:none;border-radius:7px;padding:7px 4px;font-size:13.5px;white-space:nowrap;
    color:var(--muted);line-height:1.25;transition:background .15s,color .15s}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
    box-shadow:0 0 0 1px var(--line-strong)}
  .seg button small{display:block;font-size:11.5px;color:var(--faint);font-family:var(--mono)}

  /* participants */
  .count{display:flex;align-items:center;gap:8px;margin-top:10px}
  .count .lab2{font-size:13.5px;color:var(--muted);margin-right:auto}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;
    background:var(--surface);overflow:hidden}
  .stepper button{width:32px;height:32px;border:0;background:none;font-size:17px;color:var(--muted)}
  .stepper button:hover{color:var(--ink);background:var(--sunk)}
  .stepper input{width:42px;height:32px;border:0;border-left:1px solid var(--line);
    border-right:1px solid var(--line);text-align:center;background:none;font-family:var(--mono);
    font-size:14px;-moz-appearance:textfield;appearance:textfield}
  .stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .stepper input:disabled{color:var(--muted)}
  details.noms{margin-top:10px}
  details.noms summary{font-size:13.5px;color:var(--muted);cursor:pointer;list-style:none}
  details.noms summary::-webkit-details-marker{display:none}
  details.noms summary::before{content:"+ ";font-family:var(--mono)}
  details.noms[open] summary::before{content:"− "}
  details.noms summary:hover{color:var(--ink)}
  details.noms textarea{width:100%;margin-top:8px;min-height:120px;resize:vertical;
    border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;
    font-size:14px;line-height:1.5}
  details.noms p{margin:6px 0 0;font-size:12.5px;color:var(--faint)}

  /* cases à cocher */
  .checks{display:grid;gap:6px}
  .chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
  input[type=checkbox]{appearance:none;-webkit-appearance:none;margin:0;flex:none;
    width:18px;height:18px;border:1.5px solid var(--line-strong);border-radius:5px;
    background:var(--surface);display:grid;place-items:center;cursor:pointer;
    transition:background .12s,border-color .12s}
  input[type=checkbox]::after{content:"";width:9px;height:5px;border:2px solid var(--accent-ink);
    border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px) scale(0);
    transition:transform .12s var(--ease)}
  input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
  input[type=checkbox]:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
  .linkbtn{border:0;background:none;padding:0;color:var(--muted);font-size:13.5px;
    text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;
    justify-self:start}
  .linkbtn:hover{color:var(--ink);text-decoration-color:currentColor}

  /* tirer */
  .go{display:grid;gap:8px;margin-top:auto;padding-top:4px}
  .primary{height:48px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);
    font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;
    transition:filter .15s,transform .1s}
  .primary:hover{filter:brightness(1.06)}
  .primary:active{transform:scale(.985)}
  .primary kbd{font-family:var(--mono);font-size:11px;font-weight:500;padding:2px 6px;border-radius:5px;
    background:rgba(0,0,0,.14);color:inherit}
  .secondary{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
    font-size:14px;transition:border-color .15s,transform .1s}
  .secondary:hover{border-color:var(--line-strong)}
  .secondary:active{transform:scale(.985)}
  .stat{font-size:12.5px;color:var(--faint);line-height:1.5}
  .stat button{font-size:12.5px}

  /* ============ la fiche ============ */
  .sheet{min-width:0;padding:40px 56px 48px;display:flex;flex-direction:column}
  .sheet-in{width:100%;max-width:880px;margin:0 auto;flex:1;display:flex;flex-direction:column}
  .sheet-in.wide{max-width:1320px}
  .empty{margin:auto;text-align:center;color:var(--muted);max-width:420px;padding:40px 0}
  .empty p{margin:0 0 6px;font-size:17px;color:var(--ink)}
  .empty .mono{font-size:12.5px;color:var(--faint)}
  .empty kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:1px 6px;color:var(--muted)}
  .empty .warn{color:var(--danger)}

  .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;font-size:13.5px;color:var(--muted)}
  .head .ref{font-family:var(--mono);font-weight:500;color:var(--accent);font-size:14px}
  .head .who{color:var(--ink);font-weight:500}
  .scene{font-size:clamp(24px,1.1vw + 18px,36px);line-height:1.22;font-weight:600;
    letter-spacing:-.022em;margin:14px 0 0;text-wrap:balance;max-width:30ch}
  .note{margin:12px 0 0;font-size:17px;color:var(--muted);max-width:60ch}

  .blocks{margin-top:32px;border-top:1px solid var(--line)}
  .blk{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
  .blk>.k{font-size:13.5px;color:var(--muted);padding-top:2px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .blk>.v{font-size:17px;line-height:1.5;min-width:0}
  .blk .enjeu{font-size:18px;line-height:1.48}
  .blk .mini{border:0;background:none;padding:0;font-size:12.5px;color:var(--faint);
    display:inline-flex;align-items:center;gap:5px}
  .blk .mini:hover{color:var(--ink)}

  ul.items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  .item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
    padding:6px 8px;margin:0 -8px;border-radius:8px;transition:background .3s}
  .item label{display:contents;cursor:pointer}
  .item input{margin-top:4px}
  .item .txt{transition:color .2s}
  .item.off .txt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line-strong)}
  .item .rr{opacity:0;border:0;background:none;padding:4px;margin:-1px -4px 0 0;border-radius:6px;color:var(--faint);
    transition:opacity .15s,color .15s,background .15s}
  .item:hover .rr,.item .rr:focus-visible{opacity:1}
  .item .rr:hover{color:var(--ink);background:var(--sunk)}
  @media (hover:none){.item .rr{opacity:1}}
  .item.flash{background:var(--accent-soft)}
  .addc{margin-top:6px;border:0;background:none;padding:2px 0;font-size:13.5px;color:var(--faint)}
  .addc:hover{color:var(--ink)}
  .vide{color:var(--faint);font-size:15px}

  .rendu{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14.5px;color:var(--muted)}
  .rendu .mono{color:var(--ink);font-size:14px}

  ol.dist{list-style:none;margin:0;padding:0;display:grid;gap:6px 24px;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));font-size:16px}
  ol.dist li{display:grid;grid-template-columns:2.2ch 1fr;gap:10px;align-items:baseline}
  ol.dist .n{font-family:var(--mono);font-size:13px;color:var(--faint);text-align:right}
  ol.dist .p{color:var(--muted);font-size:14px}

  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px;align-items:center}
  .actions .tbtn{height:36px}
  .actions .grow{flex:1}

  /* ============ toute la classe ============ */
  .cls-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:6px}
  .cls-head h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em}
  .cls-head span{color:var(--muted);font-size:14px}
  .cls-warn{font-size:13.5px;color:var(--muted);margin:4px 0 0}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-top:22px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;
    display:flex;flex-direction:column;gap:10px;min-width:0}
  .card-top{display:flex;align-items:baseline;gap:10px}
  .card-top .num{font-family:var(--mono);font-size:13px;color:var(--faint);min-width:2ch}
  .card-top .who{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-top .ref{font-family:var(--mono);font-size:13px;color:var(--accent);margin-left:auto;flex:none}
  .card .sc{font-size:16.5px;font-weight:500;line-height:1.38;letter-spacing:-.01em;margin:0}
  .card .en{font-size:14px;color:var(--muted);margin:0}
  .card .meta2{font-size:13px;color:var(--faint)}
  .card ul.items{gap:2px}
  .card .item{font-size:14px;padding:3px 6px;margin:0 -6px;gap:9px}
  .card .item input{width:16px;height:16px;margin-top:2px}
  .card .item.int .txt{font-style:italic}
  .card-bot{display:flex;gap:6px;margin-top:auto;padding-top:4px}
  .card-bot .tbtn{height:30px;font-size:13px;padding:0 10px}
  .back{border:0;background:none;padding:0;color:var(--muted);font-size:13.5px;margin-bottom:18px;align-self:flex-start}
  .back:hover{color:var(--ink)}

  /* entrée de fiche */
  .enter{animation:enter .32s var(--ease) both}
  .enter .blocks,.enter .cards{animation:enter .38s var(--ease) .06s both}
  @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ============ banque (fenêtre) ============ */
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);
    padding:0;width:min(920px,calc(100vw - 32px));max-height:min(86vh,900px);box-shadow:0 24px 60px rgba(0,0,0,.22)}
  dialog::backdrop{background:rgba(10,10,8,.42)}
  dialog[open]{display:flex;flex-direction:column;animation:enter .22s var(--ease)}
  .dlg-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
  .dlg-head h2{margin:0 auto 0 0;font-size:17px;font-weight:600}
  dialog[open]{height:min(86vh,900px)}
  .dlg-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
  .dlg-col{overflow:auto;padding:0 22px 22px;min-height:0}
  .dlg-col+.dlg-col{border-left:1px solid var(--line)}
  .dlg-body h3{font-size:13.5px;font-weight:500;color:var(--muted);margin:0;display:flex;
    align-items:baseline;gap:10px;position:sticky;top:0;background:var(--surface);padding:16px 0 8px;z-index:1;
    border-bottom:1px solid var(--line)}
  .dlg-body h3+.bk{margin-top:0}
  .dlg-col h3:not(:first-child){margin-top:14px}
  .dlg-body h3 .linkbtn{margin-left:auto;font-size:12.5px}
  .bk{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:5px 0;
    font-size:14px;cursor:pointer;border-bottom:1px solid var(--line)}
  .bk input{margin-top:2px}
  .bk .lv{font-family:var(--mono);font-size:11.5px;color:var(--faint);padding-top:2px;white-space:nowrap}
  .bk:has(input:not(:checked)) span:not(.lv){color:var(--faint)}
  .dlg-foot{padding:12px 22px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);
    display:flex;gap:12px;align-items:center}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;
    background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;
    pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:50}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ============ projection ============ */
  body.proj .settings,body.proj .top .hide-proj{display:none}
  body.proj .app{grid-template-columns:1fr}
  body.proj .sheet{padding:5vh 6vw}
  body.proj .sheet-in{max-width:1400px}
  body.proj .scene{font-size:clamp(34px,3.4vw,68px);max-width:28ch}
  body.proj .note{font-size:clamp(18px,1.6vw,30px)}
  body.proj .head{font-size:clamp(14px,1.1vw,20px)}
  body.proj .head .ref{font-size:clamp(15px,1.2vw,22px)}
  body.proj .blk{grid-template-columns:clamp(150px,14vw,260px) 1fr;padding:2.2vh 0}
  body.proj .blk>.k{font-size:clamp(13px,1vw,18px)}
  body.proj .blk>.v,body.proj .blk .enjeu{font-size:clamp(18px,1.55vw,30px)}
  body.proj ol.dist{font-size:clamp(17px,1.4vw,26px);grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  body.proj .rendu{font-size:clamp(14px,1.1vw,20px)}
  body.proj .cards{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
  body.proj .clock{font-size:28px}
  body.proj .item .rr,body.proj .addc,body.proj .blk .mini{display:none}
  .proj-only{display:none}
  body.proj .proj-only{display:inline-flex}

  /* ============ écrans étroits ============ */
  @media (max-width:980px){
    .app{grid-template-columns:1fr}
    .settings{border-right:0;border-bottom:1px solid var(--line);padding:20px 16px 24px;position:static;height:auto;overflow:visible}
    .sheet{scroll-margin-top:var(--top-h,63px)}
    .sheet{padding:28px 16px 40px}
    .top{padding:10px 16px;gap:10px;flex-wrap:wrap}
    .brand span{display:none}
    .top .sep{display:none}
    .blk{grid-template-columns:1fr;gap:6px}
    .blk>.k{flex-direction:row;align-items:baseline;gap:12px}
    .cards{grid-template-columns:1fr}
    .dlg-body{grid-template-columns:1fr;overflow:auto;display:block}
    .dlg-col{overflow:visible}
    .dlg-col+.dlg-col{border-left:0}
  }
  @media (max-width:560px){
    .top .tlabel{display:none}
    .top .tbtn:not(.icon){padding:0 10px}
    .chrono select{max-width:78px}
    .scene{font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }

  /* ============ impression : seulement le sujet, noir sur blanc ============ */
  .printonly{display:none}
  @media print{
    @page{margin:16mm}
    :root,:root[data-theme],:root:not([data-theme="light"]){--ink:#000;--muted:#444;--faint:#777;--line:#bbb;
      --line-strong:#999;--accent:#000;--surface:#fff;--bg:#fff;--sunk:#fff;color-scheme:light}
    body{background:#fff;color:#000;display:block;font-size:12pt}
    .top,.settings,.actions,.rr,.addc,.mini,.back,.card-bot,.toast,dialog{display:none!important}
    .app{display:block}
    .sheet{padding:0}
    .item input{display:none}
    .item{grid-template-columns:1fr;padding:2px 0;margin:0}
    .item.off{display:none}
    ul.items .item .txt::before{content:"— "}
    .scene{font-size:20pt;max-width:none}
    .blk{grid-template-columns:42mm 1fr;padding:10px 0}
    .blk>.v,.blk .enjeu{font-size:12pt}
    .enter,.enter *{animation:none!important}
    .cards{display:block}
    .card{border:1px solid #999;border-radius:0;margin:0 0 6mm;break-inside:avoid;page-break-inside:avoid}
    .printonly{display:block;margin-top:18px;font-size:11pt;color:#444;line-height:2.4}
    .card .printonly{margin-top:4px;line-height:2}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h3l1.5-3 2 7 2-11 2 14 2-12 2 8 1.5-4 1 1H22"/></svg>
    <b>Sujets</b><span>Sound design &amp; composition · 3ᵉ année</span>
  </div>

  <div class="chrono" role="group" aria-label="Chrono">
    <span class="clock" id="clock" aria-live="off">45:00</span>
    <button class="tbtn icon" id="tStart" title="Démarrer le chrono" aria-label="Démarrer le chrono">
      <svg id="icPlay" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>
      <svg id="icPause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>
    </button>
    <button class="tbtn icon" id="tReset" title="Remettre le chrono au départ" aria-label="Remettre le chrono au départ">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <select id="tPreset" aria-label="Durée du chrono">
      <option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option>
      <option value="20">20 min</option><option value="30">30 min</option><option value="45" selected>45 min</option>
      <option value="60">1 h</option><option value="90">1 h 30</option><option value="120">2 h</option>
      <option value="180">3 h</option>
    </select>
  </div>
  <span class="sep hide-proj"></span>
  <button class="tbtn hide-proj" id="btnBanque" title="Choisir les contraintes et intentions qui peuvent tomber">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg><span class="tlabel">Banque</span>
  </button>
  <button class="tbtn icon" id="btnTheme" title="Clair / sombre" aria-label="Basculer clair / sombre">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
  </button>
  <button class="tbtn" id="btnProj" title="Afficher en grand pour le vidéoprojecteur (touche P)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="tlabel" id="projLabel">Projeter</span>
  </button>
</header>

<main class="app">
  <aside class="settings" aria-label="Réglages">
    <div class="field">
      <div class="lab">Travail</div>
      <div class="seg" id="segMode" role="group" aria-label="Travail">
        <button data-v="sd" aria-pressed="true">Sound design</button>
        <button data-v="compo" aria-pressed="false">Composition</button>
        <button data-v="mix" aria-pressed="false">Les deux</button>
      </div>
    </div>

    <div class="field">
      <div class="lab">Niveau <small id="consHint">1 à 3 contraintes</small></div>
      <div class="seg" id="segDiff" style="--cols:4" role="group" aria-label="Niveau">
        <button data-v="0" aria-pressed="true" title="Au hasard">Hasard</button>
        <button data-v="1" aria-pressed="false" title="Fondamentaux · 1 contrainte">1</button>
        <button data-v="2" aria-pressed="false" title="Confirmé · 2 contraintes">2</button>
        <button data-v="3" aria-pressed="false" title="Expert · 3 contraintes">3</button>
      </div>
    </div>

    <div class="field">
      <div class="lab">Durée</div>
      <div class="seg" id="segLen" style="--cols:4" role="group" aria-label="Durée">
        <button data-v="0" aria-pressed="true">Hasard</button>
        <button data-v="1" aria-pressed="false">Court<small>20–40 s</small></button>
        <button data-v="2" aria-pressed="false">Moyen<small>1–2 min</small></button>
        <button data-v="3" aria-pressed="false">Long<small>3 min +</small></button>
      </div>
    </div>

    <div class="field">
      <div class="lab">Pour qui</div>
      <div class="seg" id="segFmt" role="group" aria-label="Pour qui">
        <button data-v="solo" aria-pressed="true" title="Un sujet">Un sujet</button>
        <button data-v="groupe" aria-pressed="false" title="Exercice de famille : une carte par participant, consigne commune">Famille</button>
        <button data-v="classe" aria-pressed="false" title="Un sujet différent pour chaque étudiant">La classe</button>
      </div>
      <div id="grpBox" hidden>
        <div class="count">
          <span class="lab2" id="countLab">Participants</span>
          <div class="stepper">
            <button id="nMinus" aria-label="Un de moins">−</button>
            <input id="nVal" type="number" inputmode="numeric" min="2" max="40" value="13" aria-label="Nombre de participants">
            <button id="nPlus" aria-label="Un de plus">+</button>
          </div>
        </div>
        <details class="noms" id="nomsBox">
          <summary>Prénoms des étudiants</summary>
          <textarea id="noms" placeholder="Un prénom par ligne" spellcheck="false"></textarea>
          <p>Gardés seulement dans ce navigateur. Le nombre de participants suit la liste.</p>
        </details>
      </div>
    </div>

    <div class="field">
      <div class="lab">Dans le sujet</div>
      <div class="checks">
        <label class="chk"><input type="checkbox" id="useInt" checked> Intention / registre</label>
        <label class="chk"><input type="checkbox" id="useCons" checked> Contraintes techniques</label>
        <button class="linkbtn" id="openBanque" style="margin-top:4px">Choisir dans la banque…</button>
      </div>
    </div>

    <div class="go">
      <button class="primary" id="draw">Tirer un sujet <kbd>Espace</kbd></button>
      <button class="secondary" id="daily" title="Le même sujet pour toute la classe aujourd'hui, avec ces réglages">Sujet du jour</button>
      <div class="stat" id="stat"></div>
    </div>
  </aside>

  <section class="sheet" aria-live="polite">
    <div class="sheet-in" id="sheet"></div>
  </section>
</main>

<dialog id="banque" aria-labelledby="banqueTitre">
  <div class="dlg-head">
    <h2 id="banqueTitre">Banque : ce qui peut tomber</h2>
    <button class="tbtn" id="bkAll">Tout réactiver</button>
    <button class="tbtn icon" id="bkClose" aria-label="Fermer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="dlg-body" id="bkBody"></div>
  <div class="dlg-foot" id="bkFoot"></div>
</dialog>

<div class="toast" id="toast" role="status"></div>
<script>
/* =========================================================
   BANQUE DE SUJETS
   t = la scène / la commande (ce qu'il se passe)
   e = ce qui doit s'entendre (l'enjeu : critère de réussite vérifiable à l'écoute)
   d = niveau (1 fondamentaux, 2 confirmé, 3 expert) — fixe le nombre de contraintes
   l = durée  (1 court, 2 moyen, 3 long)
   ========================================================= */
const SUJETS = {

/* ---------- SOUND DESIGN SEUL ---------- */
sd:[
 /* niveau 1 · court */
 {t:"Une porte en bois grince, se referme, la clé tourne dans la serrure.",
  e:"On doit entendre que la pièce derrière la porte est petite et vide.",d:1,l:1},
 {t:"Quelqu'un se sert un café : la tasse, le sucre, la cuillère, une première gorgée trop chaude.",
  e:"Chaque son porte un geste : on doit deviner la main et son humeur, pas seulement l'objet.",d:1,l:1},

const store={

  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const SEEN_KEY="sds_seen_v1", PREF_KEY="sds_reglages_v2";
let seen=new Set(store.get(SEEN_KEY,[]));
const P=Object.assign({mode:"sd",diff:0,len:0,fmt:"solo",n:13,noms:"",useInt:true,useCons:true,
                       offCons:[],offInt:[],theme:null,chrono:45},store.get(PREF_KEY,{}));

const IC_RR='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8.5"/><path d="M20 3.5v5h-5"/></svg>';

/* ========================= outils ========================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const pick=a=>a[Math.floor(rnd()*a.length)];
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function jour(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
const nomsListe=()=>P.noms.split("\n").map(s=>s.trim()).filter(Boolean);
const effectif=()=>{const n=nomsListe().length;return n>=2?n:P.n};
let toastT;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800)}

/* ========================= contraintes et intentions ========================= */
function consPool(mode,d){
  const off=new Set(P.offCons);
  return CONS.common.concat(mode==="sd"?CONS.sd:mode==="compo"?CONS.compo:CONS.sd.concat(CONS.compo))
    .filter(c=>c.min<=d&&!off.has(c.t));
}
/* deux contraintes s'excluent si l'une liste la clé de l'autre (deux tempos, synthèse + Foley…) */
const clash=(a,b)=>a.t===b.t||(a.x||[]).includes(b.k)||(b.x||[]).includes(a.k);
function pickCons(pool,n,garder){
  const c=pool.filter(p=>!garder.some(g=>clash(p,g))), out=[];
  while(out.length<n&&c.length){
    const p=c.splice(Math.floor(rnd()*c.length),1)[0];
    out.push(p);
    for(let i=c.length-1;i>=0;i--) if(clash(c[i],p)) c.splice(i,1);
  }
  return out;
}
function pickInt(sauf){
  const off=new Set(P.offInt), p=INTENTIONS.filter(t=>!off.has(t)&&t!==sauf);
  return p.length?pick(p):(sauf||null);
}
function habiller(f,d){
  f.d=d;
  f.int={t:pickInt(),on:true};
  f.cons=pickCons(consPool(f.mode,d),d,[]).map(c=>({...c,on:true}));
  return f;
}

/* ========================= tirage ========================= */
function candidats(mode){
  return SUJETS[mode].map((s,i)=>({...s,i,id:mode+"-"+i}))
    .filter(s=>(!P.diff||s.d===P.diff)&&(!P.len||s.l===P.len));
}
/* n éléments : d'abord ceux jamais tirés, puis les autres ; répétitions seulement si la réserve est trop petite */
function choisir(pool,n,daily){
  if(!daily&&pool.every(s=>seen.has(s.id))) pool.forEach(s=>seen.delete(s.id));
  const ordre=daily?melanger(pool)
    :melanger(pool.filter(s=>!seen.has(s.id))).concat(melanger(pool.filter(s=>seen.has(s.id))));
  const out=[];
  for(let i=0;i<n;i++) out.push(ordre[i%ordre.length]);
  if(!daily){out.forEach(s=>seen.add(s.id));store.set(SEEN_KEY,[...seen])}
  return out;
}
const refDe=(mode,i)=>PREFIX[mode]+"-"+String(i+1).padStart(3,"0");
function ficheSujet(s,mode){
  return habiller({kind:"sujet",mode,scene:s,ref:refDe(mode,s.i),l:s.l},s.d);
}
function tirerFamille(daily){
  const n=effectif();
  const pool=FAMILLES.map((f,i)=>({...f,i,id:"fam-"+i})).filter(f=>f.m.length>=n);
  if(!pool.length) return null;
  const fam=choisir(pool,1,daily)[0];
  const d=P.diff||1+Math.floor(rnd()*3), l=P.len||1+Math.floor(rnd()*3);
  const noms=nomsListe();
  return habiller({kind:"famille",mode:P.mode,fam,l,ref:"FA-"+String(fam.i+1).padStart(3,"0"),
    membres:melanger(fam.m).slice(0,n).map((m,i)=>({m,nom:noms[i]||""}))},d);
}
function tirer(daily){
  rnd=daily?mulberry32(hash(jour()+"|"+[P.mode,P.diff,P.len,P.fmt,P.fmt==="solo"?1:effectif()].join("|")))
           :Math.random;
  try{
    if(P.fmt==="groupe") current=tirerFamille(daily);
    else{
      const pool=candidats(P.mode);
      if(!pool.length) current=null;
      else if(P.fmt==="classe"){
        const n=effectif(), noms=nomsListe();
        current={kind:"classe",mode:P.mode,dispo:pool.length,
          fiches:choisir(pool,n,daily).map((s,i)=>Object.assign(ficheSujet(s,P.mode),{num:i+1,nom:noms[i]||""}))};
      }
      else current=ficheSujet(choisir(pool,1,daily)[0],P.mode);
    }
    horsPortee=!current;
    if(current) current.daily=!!daily;
  }finally{rnd=Math.random}
  zoom=null;
  rendre(true);
  if(current) appliquerChrono(current.kind==="classe"?null:current);
  if(current&&matchMedia("(max-width:980px)").matches)
    document.querySelector(".sheet").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ========================= affichage ========================= */
const blk=(k,v,extra)=>`<div class="blk"><div class="k"><span>${k}</span>${extra||""}</div><div class="v">${v}</div></div>`;
const itemInt=f=>`<li class="item int${f.int.on?"":" off"}"><label><input type="checkbox" data-act="tg-int"${f.int.on?" checked":""} aria-label="Garder cette intention"><span class="txt">${esc(f.int.t)}</span></label><button class="rr" data-act="rr-int" title="Une autre intention" aria-label="Tirer une autre intention">${IC_RR}</button></li>`;
const itemCons=(c,i)=>`<li class="item${c.on?"":" off"}" data-i="${i}"><label><input type="checkbox" data-act="tg-cons"${c.on?" checked":""} aria-label="Garder cette contrainte"><span class="txt">${esc(c.t)}</span></label><button class="rr" data-act="rr-con" title="Une autre contrainte" aria-label="Tirer une autre contrainte">${IC_RR}</button></li>`;

function vide(){
  const nb=Object.values(SUJETS).reduce((n,a)=>n+a.length,0);
  if(horsPortee) return `<div class="empty"><p class="warn">Rien ne correspond.</p><div>${
    P.fmt==="groupe"?`Aucune famille n'a ${effectif()} cartes (${MAX_FAM} au plus). Réduis le groupe ou passe en « La classe ».`
                    :"Aucun sujet pour ce niveau et cette durée : élargis l'un des deux."}</div></div>`;
  return `<div class="empty"><p>Choisis tes réglages, puis tire un sujet.</p>
    <div><kbd>Espace</kbd> pour tirer · <kbd>P</kbd> pour projeter</div>
    <div class="mono" style="margin-top:22px">${nb} sujets · ${TOUTES_CONS.length} contraintes · ${INTENTIONS.length} intentions · ${FAMILLES.length} familles</div></div>`;
}

    <div class="blocks">`;
  if(fam) h+=blk("Distribution",`<ol class="dist">${f.membres.map((x,i)=>
      `<li><span class="n">${i+1}</span><span>${esc(x.m)}${x.nom?` <span class="p">· ${esc(x.nom)}</span>`:""}</span></li>`).join("")}</ol>`);
  else h+=blk("Ce qui doit s'entendre",`<div class="enjeu">${esc(f.scene.e)}</div>`);

      f.int.t?`<ul class="items">${itemInt(f)}</ul>`:`<span class="vide">Toutes les intentions sont décochées dans la banque.</span>`);

      f.cons.length?`<button class="mini" data-act="rr-cons">${IC_RR} Tout changer</button>`:"");
  h+=blk(fam?"Rendu, par participant":"Rendu",
      `<div class="rendu"><span>${DUREES[f.l]}</span><span>${RENDU}</span><span class="mono">${f.ref}_NOM.wav</span></div>`);
  h+=`</div>`;
  if(!dansClasse) h+=`<div class="actions">
      <button class="tbtn" data-act="copy">Copier le texte</button>

    <div class="printonly">Nom : ............................................ &nbsp; Date : ......................</div>`;
  return h;
}

function htmlClasse(c){
  const n=c.fiches.length;
  let h=`<div class="cls-head"><h2>Toute la classe</h2><span>${n} sujets · ${MODES[c.mode]}${c.daily?" · sujets du jour":""}</span></div>`;
  if(c.dispo<n) h+=`<p class="cls-warn">Seulement ${c.dispo} sujets pour ces réglages : certains reviennent, avec une autre intention et d'autres contraintes. Élargis le niveau ou la durée pour en avoir ${n} différents.</p>`;
  h+=`<div class="cards">`+c.fiches.map((f,i)=>`<article class="card" data-n="${i}">
      <div class="card-top"><span class="num">${f.num}</span><span class="who">${f.nom?esc(f.nom):""}</span><span class="ref">${f.ref}</span></div>
      <p class="sc">${esc(f.scene.t)}</p>
      <p class="en">${esc(f.scene.e)}</p>
      ${(P.useInt&&f.int.t)||(P.useCons&&f.cons.length)?`<ul class="items">${P.useInt&&f.int.t?itemInt(f):""}${P.useCons?f.cons.map(itemCons).join(""):""}</ul>`:""}
      <div class="meta2">Niveau ${f.d} · ${DUREES[f.l]} · <span class="mono">${f.ref}_NOM.wav</span></div>
      <div class="card-bot"><button class="tbtn" data-act="zoom">Agrandir</button><button class="tbtn" data-act="rr-fiche">Autre sujet</button></div>
      ${f.nom?"":`<div class="printonly">Nom : ............................................</div>`}
    </article>`).join("")+`</div>
    <div class="actions"><button class="tbtn" data-act="copy">Copier toute la classe</button>
      <button class="tbtn" data-act="print">Imprimer les ${n} fiches</button></div>`;
  return h;
}

function rendre(anim,flashSel){
  majStat();
  if(!current) sheet.innerHTML=vide();
  else if(current.kind==="classe"&&zoom==null) sheet.innerHTML=htmlClasse(current);
  else sheet.innerHTML=htmlFiche(current.kind==="classe"?current.fiches[zoom]:current,current.kind==="classe");
  sheet.classList.toggle("wide",!!current&&current.kind==="classe"&&zoom==null);
  if(anim){sheet.classList.remove("enter");void sheet.offsetWidth;sheet.classList.add("enter")}
  if(flashSel){
    const el=sheet.querySelector(flashSel);
    if(el){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),650)}
  }
}

/* la fiche concernée par un clic : une carte de la classe, la fiche agrandie, ou le sujet seul */
function cible(el){
  if(current.kind!=="classe") return current;
  const card=el.closest(".card");
  return current.fiches[card?+card.dataset.n:zoom];
}

sheet.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b||!current) return;
  const act=b.dataset.act, f=cible(b), card=b.closest(".card");
  const pre=card?`.card[data-n="${card.dataset.n}"] `:"";
  switch(act){
    case "rr-int":
      f.int={t:pickInt(f.int.t),on:true}; rendre(false,pre+".item.int"); break;
    case "rr-con":{
      const i=+b.closest(".item").dataset.i, old=f.cons[i];
      const n=pickCons(consPool(f.mode,f.d).filter(c=>c.t!==old.t),1,f.cons.filter((_,j)=>j!==i))[0];
      if(!n){toast("Plus aucune autre contrainte compatible dans la banque");break}
      f.cons[i]={...n,on:true}; rendre(false,pre+`.item[data-i="${i}"]`); appliquerChrono(f); break;}
    case "rr-cons":
      f.cons=pickCons(consPool(f.mode,f.d),Math.max(f.cons.length,1),[]).map(c=>({...c,on:true}));
      rendre(false,pre+"ul.items"); appliquerChrono(f); break;
    case "add-cons":{
      const n=pickCons(consPool(f.mode,f.d),1,f.cons)[0];
      if(!n){toast("Plus aucune contrainte compatible à ajouter");break}
      f.cons.push({...n,on:true}); rendre(false,pre+`.item[data-i="${f.cons.length-1}"]`); appliquerChrono(f); break;}
    case "zoom": zoom=+card.dataset.n; rendre(true); window.scrollTo({top:0}); break;
    case "back": zoom=null; rendre(true); break;
    case "prev": if(zoom>0){zoom--;rendre(true)} break;
    case "next": if(zoom<current.fiches.length-1){zoom++;rendre(true)} break;
    case "rr-fiche":{
      const k=+card.dataset.n, pris=new Set(current.fiches.map(x=>x.scene.id));
      let pool=candidats(current.mode).filter(s=>!pris.has(s.id));
      if(!pool.length){toast("Tous les sujets de ces réglages sont déjà distribués");break}
      const s=choisir(pool,1,false)[0];
      current.fiches[k]=Object.assign(ficheSujet(s,current.mode),{num:f.num,nom:f.nom});
      rendre(false,`.card[data-n="${k}"]`); break;}
    case "copy": copier(); break;
    case "print": window.print(); break;
    case "redraw": tirer(false); break;
  }
});
sheet.addEventListener("change",e=>{
  const x=e.target; if(x.type!=="checkbox"||!current) return;
  const f=cible(x), li=x.closest(".item");
  if(x.dataset.act==="tg-int") f.int.on=x.checked;
  else f.cons[+li.dataset.i].on=x.checked;
  li.classList.toggle("off",!x.checked);
});

/* ========================= copier ========================= */
function texte(f,dansClasse){
  const fam=f.kind==="famille", L=[];
  L.push((dansClasse?qui(f)+" — ":"")+`Sujet ${f.ref} · ${MODES[f.mode]}${fam?" · exercice de famille":""} · niveau ${f.d} (${NIVEAUX[f.d]}) · ${DUREES[f.l]}`,"");
  if(fam){
    L.push("La famille : "+f.fam.t,f.fam.c,"","Distribution :");
    f.membres.forEach((x,i)=>L.push(`${i+1}. ${x.m}${x.nom?" ("+x.nom+")":""}`));
  } else L.push(SCENE[f.mode]+" : "+f.scene.t,"Ce qui doit s'entendre : "+f.scene.e);
  if(P.useInt&&f.int.t&&f.int.on) L.push("","Intention : "+f.int.t);
  const cs=P.useCons?f.cons.filter(c=>c.on):[];
  if(cs.length){L.push("","Contrainte"+(cs.length>1?"s":"")+" technique"+(cs.length>1?"s":"")+" :");cs.forEach(c=>L.push("- "+c.t))}
  L.push("",`Rendu : ${DUREES[f.l]} · ${RENDU} · fichier ${f.ref}_NOM.wav`);
  return L.join("\n");
}
function copier(){
  let txt;
  if(current.kind!=="classe") txt=texte(current,false);
  else if(zoom!=null) txt=texte(current.fiches[zoom],true);
  else txt=current.fiches.map(f=>texte(f,true)).join("\n\n————————————————————\n\n");
  const ok=()=>toast("Copié dans le presse-papier");
  const secours=()=>{
    const t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";
    document.body.appendChild(t);t.select();
    try{document.execCommand("copy");ok()}catch(e){toast("Copie impossible ici")}
    t.remove();
  };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(ok,secours);
  else secours();
}

/* ========================= réglages ========================= */
function segment(id,cle,conv){
  const box=$(id);
  box.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    P[cle]=conv?conv(b.dataset.v):b.dataset.v; save(); majUI();
  });
}
segment("segMode","mode");
segment("segDiff","diff",Number);
segment("segLen","len",Number);
segment("segFmt","fmt");

function setN(v){
  const max=P.fmt==="groupe"?MAX_FAM:40;
  P.n=Math.max(2,Math.min(max,Math.round(+v)||2)); save(); majUI();
}
$("nMinus").onclick=()=>setN(effectif()-1);
$("nPlus").onclick=()=>setN(effectif()+1);
$("nVal").addEventListener("change",e=>setN(e.target.value));
$("noms").addEventListener("input",e=>{P.noms=e.target.value;save();majUI()});
$("useInt").addEventListener("change",e=>{P.useInt=e.target.checked;save();if(current)rendre()});
$("useCons").addEventListener("change",e=>{P.useCons=e.target.checked;save();if(current)rendre()});

function majUI(){
  [["segMode",P.mode],["segDiff",P.diff],["segLen",P.len],["segFmt",P.fmt]].forEach(([id,v])=>
    [...$(id).children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===String(v)))));
  $("grpBox").hidden=P.fmt==="solo";
  $("countLab").textContent=P.fmt==="groupe"?"Participants":"Étudiants";
  const noms=nomsListe();
  $("nVal").value=effectif();
  $("nVal").disabled=noms.length>=2;
  $("nMinus").disabled=$("nPlus").disabled=noms.length>=2;
  $("nVal").max=P.fmt==="groupe"?MAX_FAM:40;
  if($("noms").value!==P.noms) $("noms").value=P.noms;
  $("nomsBox").querySelector("summary").textContent=noms.length?`Prénoms (${noms.length})`:"Prénoms des étudiants";
  $("useInt").checked=P.useInt; $("useCons").checked=P.useCons;
  $("consHint").textContent=P.diff?P.diff+" contrainte"+(P.diff>1?"s":"")+" · "+NIVEAUX[P.diff]:"1 à 3 contraintes";
  $("draw").firstChild.textContent=BOUTON[P.fmt]+" ";
  const off=P.offCons.length+P.offInt.length;
  $("openBanque").textContent="Choisir dans la banque…"+(off?` (${off} décochée${off>1?"s":""})`:"");
  majStat();
}
function majStat(){
  let s;
  if(P.fmt==="groupe"){
    const n=effectif(), k=FAMILLES.filter(f=>f.m.length>=n).length;
    s=k?`${k} famille${k>1?"s":""} d'au moins ${n} cartes`:`<span style="color:var(--danger)">Aucune famille de ${n} cartes (${MAX_FAM} au plus)</span>`;
  } else {
    const pool=candidats(P.mode), deja=pool.filter(x=>seen.has(x.id)).length;
    s=`${pool.length} sujet${pool.length>1?"s":""} pour ces réglages`+(deja?` · ${deja} déjà tiré${deja>1?"s":""}`:"");
    if(P.fmt==="classe"&&pool.length<effectif()) s+=`<br><span style="color:var(--danger)">Moins de sujets que d'étudiants : élargis le niveau ou la durée</span>`;
  }
  if(seen.size) s+=` · <button class="linkbtn" id="resetSeen" title="Les sujets déjà tirés reviennent dans le tirage">Remettre à zéro</button>`;
  $("stat").innerHTML=s;
  const r=$("resetSeen");
  if(r) r.onclick=()=>{seen.clear();store.del(SEEN_KEY);majStat();toast("Historique remis à zéro")};
}

$("draw").onclick=()=>tirer(false);
$("daily").onclick=()=>tirer(true);

/* ========================= banque ========================= */
const SECTIONS=[["common","Contraintes · tous les travaux"],["sd","Contraintes · sound design"],["compo","Contraintes · composition"]];
function construireBanque(){
  const offC=new Set(P.offCons), offI=new Set(P.offInt);
  const sec=(titre,cle,lignes,actives,total)=>`<h3>${titre} <span class="mono" data-cnt="${cle}">${actives}/${total}</span>
      <button class="linkbtn" data-bk="${cle}">${actives?"Tout décocher":"Tout cocher"}</button></h3>${lignes}`;
  const pos=[...$("bkBody").querySelectorAll(".dlg-col")].map(c=>c.scrollTop);
  let g='<div class="dlg-col">';
  SECTIONS.forEach(([k,titre])=>{
    const l=CONS[k].map((c,i)=>`<label class="bk"><input type="checkbox" data-s="${k}" data-i="${i}"${offC.has(c.t)?"":" checked"}><span>${esc(c.t)}</span><span class="lv">niv. ${c.min}+</span></label>`).join("");
    g+=sec(titre,k,l,CONS[k].filter(c=>!offC.has(c.t)).length,CONS[k].length);
  });
  g+='</div><div class="dlg-col">';
  const l=INTENTIONS.map((t,i)=>`<label class="bk"><input type="checkbox" data-s="int" data-i="${i}"${offI.has(t)?"":" checked"}><span>${esc(t)}</span><span></span></label>`).join("");
  g+=sec("Intentions","int",l,INTENTIONS.filter(t=>!offI.has(t)).length,INTENTIONS.length)+"</div>";
  $("bkBody").innerHTML=g;
  $("bkBody").querySelectorAll(".dlg-col").forEach((c,i)=>{if(pos[i])c.scrollTop=pos[i]});
  $("bkFoot").textContent="Une case décochée ne tombe plus au tirage. Le réglage reste enregistré dans ce navigateur.";
}
const texteDe=(s,i)=>s==="int"?INTENTIONS[i]:CONS[s][i].t;
function basculer(s,i,on){
  const liste=s==="int"?P.offInt:P.offCons, t=texteDe(s,i), j=liste.indexOf(t);
  if(on&&j>=0) liste.splice(j,1);
  if(!on&&j<0) liste.push(t);
}
$("bkBody").addEventListener("change",e=>{
  const x=e.target; if(x.type!=="checkbox") return;
  basculer(x.dataset.s,+x.dataset.i,x.checked); save(); majUI();
  const s=x.dataset.s, tous=$("bkBody").querySelectorAll(`input[data-s="${s}"]`);
  const act=[...tous].filter(y=>y.checked).length;
  $("bkBody").querySelector(`[data-cnt="${s}"]`).textContent=act+"/"+tous.length;
  $("bkBody").querySelector(`[data-bk="${s}"]`).textContent=act?"Tout décocher":"Tout cocher";
});
$("bkBody").addEventListener("click",e=>{
  const b=e.target.closest("[data-bk]"); if(!b) return;
  const s=b.dataset.bk, tous=[...$("bkBody").querySelectorAll(`input[data-s="${s}"]`)];
  const on=!tous.some(y=>y.checked);
  tous.forEach(y=>basculer(s,+y.dataset.i,on));
  save(); majUI(); construireBanque();
});
function ouvrirBanque(){construireBanque();$("banque").showModal()}
$("btnBanque").onclick=ouvrirBanque;
$("openBanque").onclick=ouvrirBanque;
$("bkClose").onclick=()=>$("banque").close();
$("bkAll").onclick=()=>{P.offCons=[];P.offInt=[];save();majUI();construireBanque()};
$("banque").addEventListener("click",e=>{if(e.target===$("banque"))$("banque").close()});

/* ========================= thème ========================= */
function appliquerTheme(){
  if(P.theme) document.documentElement.dataset.theme=P.theme;
  else delete document.documentElement.dataset.theme;
}
$("btnTheme").onclick=()=>{
  const sombre=P.theme?P.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  P.theme=sombre?"light":"dark"; save(); appliquerTheme();
};

/* ========================= projection ========================= */
function projeter(on){
  document.body.classList.toggle("proj",on);
  $("btnProj").setAttribute("aria-pressed",String(on));
  $("projLabel").textContent=on?"Quitter":"Projeter";
  const el=document.documentElement;
  try{
    let r;
    if(on&&!document.fullscreenElement&&!document.webkitFullscreenElement)
      r=(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
    if(!on&&(document.fullscreenElement||document.webkitFullscreenElement))
      r=(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    if(r&&r.catch) r.catch(()=>{});   /* plein écran refusé : le mode projection reste actif */
  }catch(e){}
}
$("btnProj").onclick=()=>projeter(!document.body.classList.contains("proj"));
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,()=>{
  if(!document.fullscreenElement&&!document.webkitFullscreenElement&&document.body.classList.contains("proj")) projeter(false);
}));

/* ========================= clavier ========================= */
document.addEventListener("keydown",e=>{
  if($("banque").open||e.metaKey||e.ctrlKey||e.altKey) return;
  const tag=document.activeElement.tagName;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
  if(e.code==="Space"&&tag!=="BUTTON"&&tag!=="SUMMARY"){e.preventDefault();tirer(false)}
  else if(e.key==="p"||e.key==="P") projeter(!document.body.classList.contains("proj"));
  else if(e.key==="Escape"&&document.body.classList.contains("proj")) projeter(false);
  else if(current&&current.kind==="classe"&&zoom!=null){
    if(e.key==="ArrowLeft"&&zoom>0){zoom--;rendre(true)}
    if(e.key==="ArrowRight"&&zoom<current.fiches.length-1){zoom++;rendre(true)}
  }
});

/* ========================= chrono ========================= */
let total=P.chrono*60, left=total, fin=0, tick=null, actx=null;
function fmt(s){
  const neg=s<0; s=Math.abs(s);
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (neg?"−":"")+(h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(x).padStart(2,"0");
}
function paint(){
  const el=$("clock");
  el.textContent=fmt(left);
  el.className="clock"+(left<0?" over":tick?" running":"");
  $("icPlay").hidden=!!tick; $("icPause").hidden=!tick;
  $("tStart").setAttribute("aria-label",tick?"Mettre en pause":"Démarrer le chrono");
  $("tStart").title=tick?"Pause":"Démarrer le chrono";
  document.title=tick?fmt(left)+" · Sujets":"Sujets — Sound design & composition";
}
function start(){
  if(tick){clearInterval(tick);tick=null;paint();return}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  fin=Date.now()+left*1000;
  tick=setInterval(()=>{
    const avant=left; left=Math.ceil((fin-Date.now())/1000);
    if(avant>0&&left<=0) bip();
    if(left!==avant) paint();
  },200);
  paint();
}
function reset(){if(tick){clearInterval(tick);tick=null}left=total;paint()}
function bip(){
  try{
    const ctx=actx||(actx=new (window.AudioContext||window.webkitAudioContext)());
    [0,.35,.7].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0,ctx.currentTime+t);
      g.gain.linearRampToValueAtTime(.25,ctx.currentTime+t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.25);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.3);
    });
  }catch(e){}
}
function regler(min){
  total=min*60; P.chrono=min; save();
  const sel=$("tPreset");
  if(![...sel.options].some(o=>+o.value===min)) sel.add(new Option(min+" min",min));
  sel.value=String(min); reset();
}
/* une contrainte « temps limité » règle le chrono, sauf s'il tourne déjà */
function appliquerChrono(f){
  if(!f||tick) return;
  const c=(f.cons||[]).find(c=>c.on&&c.chrono);
  if(c&&total!==c.chrono*60){regler(c.chrono);toast("Chrono réglé sur "+c.chrono+" min")}
}
$("tPreset").addEventListener("change",e=>regler(+e.target.value));
$("tStart").onclick=start;
$("tReset").onclick=reset;

/* hauteur réelle de la barre du haut (elle passe sur deux lignes sur téléphone) */
function majTop(){document.documentElement.style.setProperty("--top-h",document.querySelector(".top").offsetHeight+"px")}
window.addEventListener("resize",majTop);

/* ========================= démarrage ========================= */
majTop();
appliquerTheme();
regler(P.chrono);
majUI();
rendre();
</script>
